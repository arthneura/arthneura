services:
  pg:
    image: postgres:16
    environment:
      POSTGRES_USER: arthneura
      POSTGRES_PASSWORD: arthneura
      POSTGRES_DB: arthneura_market
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../arthneura-market/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arthneura -d arthneura_market"]
      interval: 5s
      retries: 20

  node:
    build:
      context: ../arthneura-core
      dockerfile: Dockerfile
    command:
      [
        "--chain",
        "dev",
        "--base-path",
        "/data",
        "--alice",
        "--validator",
        "--force-authoring",
        "--unsafe-force-node-key-generation",
        "--rpc-external",
        "--rpc-cors=all",
        "--rpc-methods=unsafe",
      ]
    volumes:
      - nodedata:/data
    ports:
      - "9944:9944"

  indexer:
    build:
      context: ../arthneura-market
      dockerfile: Dockerfile
      target: indexer
    environment:
      CHAIN_WS: ws://node:9944
      DATABASE_URL: postgres://arthneura:arthneura@pg:5432/arthneura_market?sslmode=disable
    depends_on:
      pg:
        condition: service_healthy
      node:
        condition: service_started
    restart: unless-stopped

  api:
    build:
      context: ../arthneura-market
      dockerfile: Dockerfile
      target: api
    environment:
      DATABASE_URL: postgres://arthneura:arthneura@pg:5432/arthneura_market?sslmode=disable
      HTTP_ADDR: :8080
    ports:
      - "8080:8080"
    depends_on:
      pg:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  nodedata:
